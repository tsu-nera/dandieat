baseURL = "https://tsu-nera.github.io/dandieat/"
languageCode = "ja-jp"
title = "Dandieat"
theme = "hugo-theme-stack"
canonifyURLs = true

# CJK言語のサポート
hasCJKLanguage = true
defaultContentLanguage = "ja"

[pagination]
pagerSize = 10

[params]
mainSections = ["post", "posts"]
rssFullContent = true
favicon = "/img/default.jpg"

[params.footer]
since = 2013

[params.sidebar]
emoji = "🦊"
subtitle = "きつねの雑記ブログ"

[params.article]
math = false
toc = true
readingTime = true

[params.article.license]
enabled = false

# ウィジェット設定
[params.widgets]
homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 12 } },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } }
]
page = [
    { type = "toc" }
]

# コメント機能（無効化）
[params.comments]
enabled = false

# 画像処理
[params.imageProcessing.cover]
enabled = true

[params.imageProcessing.content]
enabled = true

# メニュー設定は content/page/ のFront Matterで管理
# [[menu.main]]は削除し、各ページのFront Matterで設定

# タクソノミー設定
[taxonomies]
category = "categories"
tag = "tags"
